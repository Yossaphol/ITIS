  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap');

  :root{
    --bg: #0c1210;
    --panel: #10221c;
    --chrome: #16332a;
    --text: #baf7d0;
    --text-dim: #6f9986;
    --amber: #ffb454;
    --red: #ff6b6b;
    --border: #1e4536;
    --cursor: #baf7d0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at top, #0e1a15 0%, #060a08 70%);
    font-family:'IBM Plex Sans Thai','JetBrains Mono',monospace;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  .wrap{
    width: min(920px, 96vw);
    height: min(640px, 92vh);
    display:flex; flex-direction:column;
    border-radius: 10px;
    overflow:hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px var(--border);
    background: var(--bg);
  }
  .titlebar{
    background: var(--chrome);
    padding: 10px 14px;
    display:flex; align-items:center; gap:10px;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  .dots{ display:flex; gap:7px; }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#ff5f57; } .dot.y{ background:#febc2e; } .dot.g{ background:#28c840; }
  .titletext{
    flex:1; text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12px; color: var(--text-dim);
    letter-spacing:0.03em;
  }
  .term{
    flex:1; overflow-y:auto;
    padding: 16px 18px 8px;
    font-family:'JetBrains Mono',monospace;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    position:relative;
  }
  .term::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .line{ white-space:pre-wrap; word-break:break-word; }
  .prompt-line{ display:flex; gap:6px; flex-wrap:wrap; }
  .ps-user{ color:#7dd3fc; }
  .ps-at{ color: var(--text-dim); }
  .ps-host{ color:#7dd3fc; }
  .ps-path{ color: var(--amber); }
  .ps-dollar{ color: var(--text-dim); margin-right:2px; }
  .cmd-echo{ color: var(--text); }
  .out-dim{ color: var(--text-dim); }
  .out-err{ color: var(--red); }
  .out-file{ color:#7dd3fc; }
  .out-dir{ color: var(--amber); font-weight:700; }
  .match{ background: rgba(255,180,84,0.18); color:var(--amber); border-radius:2px; padding:0 1px;}
  .inputbar{
    border-top:1px solid var(--border);
    background: rgba(255,255,255,0.015);
    display:flex; align-items:center; gap:8px;
    padding: 10px 18px;
    flex-shrink:0;
  }
  .inputbar .static-prompt{ font-family:'JetBrains Mono',monospace; font-size:13.5px; white-space:nowrap; }
  input#cmdInput{
    flex:1; background:transparent; border:none; outline:none;
    color: var(--text); font-family:'JetBrains Mono',monospace; font-size:13.5px;
    caret-color: var(--cursor);
  }
  input#cmdInput::placeholder{ color: rgba(186,247,208,0.25); }
  .term::-webkit-scrollbar{ width:10px; }
  .term::-webkit-scrollbar-thumb{ background: var(--border); border-radius:6px; }
  .hint{
    font-size:11px; color: var(--text-dim); padding: 0 18px 10px; font-family:'JetBrains Mono',monospace;
  }
</style>
</head>

// ---------- virtual filesystem ----------
const FS = {
  type: 'dir',
  name: '/',
  children: {
    home: { type:'dir', name:'home', children: {
      student: { type:'dir', name:'student', children: {
        investigation: { type:'dir', name:'investigation', children: {
          logs: { type:'dir', name:'logs', children: {
            'auth.log': { type:'file', name:'auth.log', content: LOG_FILES['auth.log'] },
            'syslog': { type:'file', name:'syslog', content: LOG_FILES['syslog'] },
            'application.log': { type:'file', name:'application.log', content: LOG_FILES['application.log'] },
            'mail.log': { type:'file', name:'mail.log', content: LOG_FILES['mail.log'] },
          }}
        }}
      }}
    }}
  }
};
const HOME = ['home','student'];
let cwd = [...HOME]; // path segments from root

function resolveNode(pathSegs){
  let node = FS;
  for(const seg of pathSegs){
    if(node.type !== 'dir' || !node.children[seg]) return null;
    node = node.children[seg];
  }
  return node;
}
function dirLabel(){
  // ~ style label
  const p = cwd.join('/');
  const homeP = HOME.join('/');
  if(p === homeP) return '~';
  if(p.startsWith(homeP+'/')) return '~/' + p.slice(homeP.length+1);
  return '/' + p;
}
function fullLabel(){ return dirLabel(); }

function resolvePathArg(arg){
  if(!arg || arg === '.') return [...cwd];
  if(arg === '~') return [...HOME];
  if(arg === '..') {
    const c = [...cwd]; if(c.length>1) c.pop(); return c;
  }
  let segs;
  if(arg.startsWith('/')) segs = arg.split('/').filter(Boolean);
  else if(arg.startsWith('~/')) segs = [...HOME, ...arg.slice(2).split('/').filter(Boolean)];
  else segs = [...cwd, ...arg.split('/').filter(Boolean)];
  // collapse . and ..
  const out = [];
  for(const s of segs){
    if(s === '.' ) continue;
    else if(s === '..') out.pop();
    else out.push(s);
  }
  return out;
}

// ---------- command implementations (operate on array-of-lines "streams") ----------
function cmd_ls(args){
  const flags = args.filter(a=>a.startsWith('-')).join('');
  const target = args.filter(a=>!a.startsWith('-'))[0];
  const segs = target ? resolvePathArg(target) : cwd;
  const node = resolveNode(segs);
  if(!node) return {err:`ls: cannot access '${target}': No such file or directory`};
  if(node.type === 'file') return {out:[node.name]};
  const entries = Object.values(node.children);
  const long = flags.includes('l') || flags.includes('a') && flags.includes('l');
  if(flags.includes('l')){
    const lines = entries.map(e=>{
      const isDir = e.type==='dir';
      const perm = isDir ? 'drwxr-xr-x' : '-rw-r--r--';
      const size = isDir ? 4096 : (e.content ? e.content.length : 0);
      return `${perm}  1 student student ${String(size).padStart(6)} Aug 12 09:00 ${e.name}${isDir?'/':''}`;
    });
    return {out: lines};
  }
  return {out: entries.map(e=> e.type==='dir' ? e.name+'/' : e.name)};
}

function cmd_pwd(){ return {out:['/' + cwd.join('/')]}; }
function cmd_whoami(){ return {out:['student']}; }
function cmd_hostname(){ return {out:['examvm']}; }
function cmd_date(){ return {out:['Wed Aug 12 09:41:03 UTC 2026']}; }

function cmd_cd(args){
  const target = args[0];
  if(!target || target==='~'){ cwd=[...HOME]; return {out:[]}; }
  const segs = resolvePathArg(target);
  const node = resolveNode(segs);
  if(!node) return {err:`bash: cd: ${target}: No such file or directory`};
  if(node.type !== 'dir') return {err:`bash: cd: ${target}: Not a directory`};
  cwd = segs;
  return {out:[]};
}

function getFileLines(fname){
  const segs = resolvePathArg(fname);
  const node = resolveNode(segs);
  if(!node) return {err:`cat: ${fname}: No such file or directory`};
  if(node.type !== 'file') return {err:`cat: ${fname}: Is a directory`};
  return {out: node.content.split('\n').filter((l,i,arr)=> !(i===arr.length-1 && l==='')) };
}

function cmd_cat(args, stdin){
  if(args.length===0) return stdin ? {out: stdin} : {err:'cat: missing file operand'};
  let all = [];
  for(const f of args){
    const r = getFileLines(f);
    if(r.err) return r;
    all = all.concat(r.out);
  }
  return {out: all};
}

function cmd_head(args, stdin){
  let n = 10;
  const rest = [];
  for(let i=0;i<args.length;i++){
    if(args[i]==='-n'){ n = parseInt(args[++i]||'10',10); }
    else if(/^-\d+$/.test(args[i])){ n = parseInt(args[i].slice(1),10); }
    else rest.push(args[i]);
  }
  let lines;
  if(rest.length){ const r = getFileLines(rest[0]); if(r.err) return r; lines = r.out; }
  else lines = stdin || [];
  return {out: lines.slice(0,n)};
}
function cmd_tail(args, stdin){
  let n = 10;
  const rest = [];
  for(let i=0;i<args.length;i++){
    if(args[i]==='-n'){ n = parseInt(args[++i]||'10',10); }
    else if(/^-\d+$/.test(args[i])){ n = parseInt(args[i].slice(1),10); }
    else rest.push(args[i]);
  }
  let lines;
  if(rest.length){ const r = getFileLines(rest[0]); if(r.err) return r; lines = r.out; }
  else lines = stdin || [];
  return {out: n>=lines.length ? lines : lines.slice(-n)};
}

function cmd_wc(args, stdin){
  const flags = args.filter(a=>a.startsWith('-'));
  const files = args.filter(a=>!a.startsWith('-'));
  let lines;
  if(files.length){ const r = getFileLines(files[0]); if(r.err) return r; lines = r.out; }
  else lines = stdin || [];
  const nlines = lines.length;
  const nwords = lines.reduce((acc,l)=> acc + (l.trim()? l.trim().split(/\s+/).length:0), 0);
  const nchars = lines.reduce((acc,l)=> acc + l.length + 1, 0);
  if(flags.includes('-l')) return {out:[String(nlines) + (files.length? ' '+files[0]:'')]};
  if(flags.includes('-w')) return {out:[String(nwords) + (files.length? ' '+files[0]:'')]};
  if(flags.includes('-c')) return {out:[String(nchars) + (files.length? ' '+files[0]:'')]};
  return {out:[`  ${nlines}  ${nwords} ${nchars}` + (files.length? ' '+files[0]:'')]};
}

function tokenizeQuoted(str){
  // split respecting single/double quotes
  const out = [];
  let cur = '', inQ = null;
  for(let i=0;i<str.length;i++){
    const c = str[i];
    if(inQ){
      if(c===inQ){ inQ=null; } else cur+=c;
    } else if(c==='"'||c==="'"){ inQ=c; }
    else if(/\s/.test(c)){ if(cur){out.push(cur); cur='';} }
    else cur+=c;
  }
  if(cur) out.push(cur);
  return out;
}

function cmd_grep(args, stdin){
  let ignoreCase=false, count=false, invert=false, lineNum=false;
  const rest = [];
  for(const a of args){
    if(a[0]==='-' && a.length>1 && !/^\-\d/.test(a)){
      for(const ch of a.slice(1)){
        if(ch==='i') ignoreCase=true;
        else if(ch==='c') count=true;
        else if(ch==='v') invert=true;
        else if(ch==='n') lineNum=true;
      }
    } else rest.push(a);
  }
  if(rest.length===0) return {err:'grep: missing pattern'};
  const pattern = rest[0];
  const files = rest.slice(1);
  let lines;
  if(files.length){ const r = getFileLines(files[0]); if(r.err) return r; lines = r.out; }
  else lines = stdin || [];
  let re;
  try{ re = new RegExp(pattern, ignoreCase?'i':''); }
  catch(e){ return {err:`grep: invalid pattern`}; }
  const matched = [];
  lines.forEach((l,idx)=>{
    const isMatch = re.test(l);
    if(isMatch !== invert){
      const prefix = lineNum ? (idx+1)+':' : '';
      matched.push(prefix + l);
    }
  });
  if(count) return {out:[String(matched.length)]};
  return {out: matched, highlight: invert? null : pattern, highlightFlags: ignoreCase?'gi':'g'};
}

function cmd_sort(args, stdin){
  const numeric = args.includes('-n');
  const reverse = args.includes('-r');
  const unique = args.includes('-u');
  let lines = [...(stdin||[])];
  lines.sort((a,b)=> numeric ? (parseFloat(a)||0)-(parseFloat(b)||0) : a.localeCompare(b));
  if(reverse) lines.reverse();
  if(unique) lines = [...new Set(lines)];
  return {out: lines};
}

function cmd_uniq(args, stdin){
  const count = args.includes('-c');
  const lines = stdin || [];
  const out = [];
  let i=0;
  while(i<lines.length){
    let j=i, c=0;
    while(j<lines.length && lines[j]===lines[i]){ j++; c++; }
    out.push(count ? `${String(c).padStart(7)} ${lines[i]}` : lines[i]);
    i=j;
  }
  return {out};
}

function cmd_awk(args, stdin){
  // support: awk '{print $N}'  or  awk '{print $N, $M}'
  const prog = args.join(' ');
  const m = prog.match(/\{\s*print\s+([^}]+)\}/);
  const lines = stdin || [];
  if(!m) return {err:'awk: unsupported program (this simulator only supports {print $N})'};
  const fieldsExpr = m[1].split(',').map(s=>s.trim());
  const out = lines.map(line=>{
    const parts = line.trim().split(/\s+/);
    return fieldsExpr.map(fe=>{
      if(fe==='$0') return line;
      const fm = fe.match(/^\$(\d+)$/);
      if(fm) return parts[parseInt(fm[1],10)-1] ?? '';
      return fe;
    }).join(' ');
  });
  return {out};
}

function cmd_cut(args, stdin){
  const dArg = args.find(a=>a.startsWith('-d'));
  const fArg = args.find(a=>a.startsWith('-f'));
  const delim = dArg ? dArg.replace('-d','').replace(/['"]/g,'') || ' ' : ' ';
  const fieldIdx = fArg ? parseInt(fArg.replace('-f',''),10) : 1;
  const lines = stdin || [];
  return {out: lines.map(l=> l.split(delim)[fieldIdx-1] ?? '')};
}

function cmd_echo(args){ return {out:[args.join(' ')]}; }
function cmd_clear(){ term.innerHTML=''; return {out:null}; }

const SIMPLE_CMDS = {
  ls: cmd_ls, pwd: cmd_pwd, whoami: cmd_whoami, hostname: cmd_hostname, date: cmd_date,
  cd: cmd_cd, cat: cmd_cat, head: cmd_head, tail: cmd_tail, wc: cmd_wc, grep: cmd_grep,
  sort: cmd_sort, uniq: cmd_uniq, awk: cmd_awk, cut: cmd_cut, echo: cmd_echo, clear: cmd_clear,
};

function runSingle(cmdStr, stdin){
  const tokens = tokenizeQuoted(cmdStr.trim());
  if(tokens.length===0) return {out: stdin || []};
  const [cmd, ...args] = tokens;
  if(cmd === 'clear'){ return cmd_clear(); }
  if(!(cmd in SIMPLE_CMDS)){
    return {err: `bash: ${cmd}: command not found`};
  }
  if(['ls','pwd','whoami','hostname','date','cd','echo'].includes(cmd)){
    return SIMPLE_CMDS[cmd](args);
  }
  return SIMPLE_CMDS[cmd](args, stdin);
}

function runPipeline(fullCmd){
  const stages = fullCmd.split('|').map(s=>s.trim()).filter(Boolean);
  if(stages.length===0) return {out:[]};
  let stdin = null;
  let result;
  for(const stage of stages){
    result = runSingle(stage, stdin);
    if(result.err) return result;
    stdin = result.out;
  }
  return result;
}

function highlightMatches(line, pattern, flags){
  if(!pattern) return esc(line);
  try{
    const re = new RegExp('('+pattern+')', flags);
    return esc(line).replace(new RegExp('('+pattern.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\\\\/g,'\\')+')', flags), m=>`<span class="match">${m}</span>`);
  }catch(e){ return esc(line); }
}

function execute(raw){
  const cmdText = raw;
  printPromptEcho(cmdText);
  if(!cmdText.trim()){ return; }
  if(cmdText.trim() === 'clear'){ term.innerHTML=''; return; }
  const result = runPipeline(cmdText);
  updatePromptLabel();
  if(result.err){
    printLine(`<span class="out-err">${esc(result.err)}</span>`);
    return;
  }
  if(result.out === null) return;
  if(result.out.length === 0){ return; }
  for(const line of result.out){
    if(result.highlight){
      printLine(highlightMatches(line, result.highlight, result.highlightFlags||'g'));
    } else {
      printLine(esc(line));
    }
  }
}

    const val = cmdInput.value;
    execute(val);
    if(val.trim()){ history.push(val); }
    histIdx = history.length;
    cmdInput.value='';
  } else if(e.key==='ArrowUp'){
    if(histIdx>0){ histIdx--; cmdInput.value = history[histIdx]; setTimeout(()=>cmdInput.setSelectionRange(9999,9999),0); }
    e.preventDefault();
  } else if(e.key==='ArrowDown'){
    if(histIdx<history.length-1){ histIdx++; cmdInput.value = history[histIdx]; }
    else { histIdx = history.length; cmdInput.value=''; }
    e.preventDefault();
  }
});
document.addEventListener('click', ()=> cmdInput.focus());
</script>
</body>
</html>
